<!doctype html>

<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Vazirmatn';
        src: url('../../assets/fonts/vazirmatn-arabic-wght-normal.woff2')
          format('woff2-variations');
        font-weight: 100 900;
        unicode-range: U+0600-06FF, U+200C-200E, U+FB50-FDFF, U+FE70-FEFC;
      }
      @font-face {
        font-family: 'Vazirmatn';
        src: url('../../assets/fonts/vazirmatn-latin-wght-normal.woff2')
          format('woff2-variations');
        font-weight: 100 900;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        position: relative;
        font-family: 'Vazirmatn', Tahoma, sans-serif;
        color: #e9f7f0;
        background:
          radial-gradient(55% 80% at 18% 30%, rgb(11 68 53 / 0.95), transparent 70%),
          radial-gradient(40% 60% at 100% 100%, rgb(25 197 139 / 0.16), transparent 70%),
          #06271f;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgb(163 244 81 / 0.1) 1.2px, transparent 1.5px);
        background-size: 26px 26px;
        -webkit-mask-image: radial-gradient(ellipse 45% 70% at 22% 50%, #000 30%, transparent 75%);
      }
      svg.circuits {
        position: absolute;
        inset: 0;
      }
      .trace {
        fill: none;
        stroke: rgb(25 197 139 / 0.4);
        stroke-width: 1.6;
        stroke-linejoin: round;
      }
      .content {
        position: absolute;
        inset-block: 0;
        inset-inline-start: 0;
        width: 700px;
        padding: 92px 84px 0 0;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 22px;
      }
      .brand svg {
        width: 92px;
        height: 92px;
      }
      .brand h1 {
        font-size: 78px;
        font-weight: 900;
        line-height: 1.1;
        color: #fff;
      }
      .brand small {
        display: block;
        margin-top: 8px;
        font: 600 16px/1 ui-monospace, monospace;
        letter-spacing: 0.36em;
        color: rgb(233 247 240 / 0.5);
        direction: ltr;
        text-align: end;
      }
      .tagline {
        margin-top: 46px;
        font-size: 46px;
        font-weight: 800;
        line-height: 1.45;
        color: #fff;
      }
      .tagline em {
        font-style: normal;
        background: linear-gradient(to left, #a3f451, #19c58b 85%);
        -webkit-background-clip: text;
        color: transparent;
      }
      .chips {
        display: flex;
        gap: 12px;
        margin-top: 40px;
      }
      .chips span {
        padding: 10px 18px;
        border-radius: 8px;
        border: 1px solid rgb(163 244 81 / 0.28);
        background: rgb(163 244 81 / 0.06);
        font-size: 21px;
        font-weight: 600;
        color: rgb(233 247 240 / 0.85);
      }
      .domain {
        position: absolute;
        left: 70px;
        bottom: 52px;
        font: 600 22px/1 ui-monospace, monospace;
        letter-spacing: 0.08em;
        color: #a3f451;
        direction: ltr;
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <svg class="circuits" viewBox="0 0 1200 630" aria-hidden="true">
      <defs>
        <radialGradient id="g">
          <stop offset="0" stop-color="#a3f451" stop-opacity="0.85" />
          <stop offset="1" stop-color="#a3f451" stop-opacity="0" />
        </radialGradient>
      </defs>
      <path class="trace" d="M-10 160 H150 L190 200 H330 L360 230 V330" />
      <path class="trace" d="M-10 176 H143 L183 216 H318 L344 242 V350" />
      <path class="trace" d="M-10 192 H136 L176 232 H306 L328 254 V370" />
      <path class="trace" d="M90 640 V520 L130 480 H300 L340 440 H420" />
      <path class="trace" d="M106 640 V527 L139 494 H306 L346 454 H404" />
      <path class="trace" d="M440 -10 V70 L470 100 H520" />
      <circle cx="360" cy="330" r="5" fill="#19c58b" />
      <circle cx="344" cy="350" r="5" fill="#19c58b" />
      <circle cx="328" cy="370" r="5" fill="#19c58b" />
      <circle cx="420" cy="440" r="26" fill="url(#g)" />
      <circle cx="420" cy="440" r="6" fill="#a3f451" />
      <circle cx="404" cy="454" r="5" fill="#19c58b" />
      <circle cx="520" cy="100" r="22" fill="url(#g)" />
      <circle cx="520" cy="100" r="5" fill="#a3f451" />
      <g transform="translate(150 300)">
        <rect x="0" y="0" width="120" height="120" rx="18" fill="#0b4435" stroke="rgb(25 197 139 / 0.6)" stroke-width="2" />
        <g transform="translate(12 12) scale(2.4)">
          <path d="M26.7 13.3A9.5 9.5 0 1 0 29.4 21.3H23.2" fill="none" stroke="#19c58b" stroke-width="2.6" stroke-linecap="round" />
          <circle cx="21" cy="21.3" r="2.5" fill="#a3f451" />
        </g>
      </g>
    </svg>

    <div class="content">
      <div class="brand">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <path fill="#0b4435" stroke="rgb(25 197 139 / 0.5)" d="M9 1h22a8 8 0 0 1 8 8v22a8 8 0 0 1-8 8H9a8 8 0 0 1-8-8V8.2L8.2 1Z" />
          <path fill="none" stroke="#19c58b" stroke-width="3" stroke-linecap="round" d="M26.7 13.3A9.5 9.5 0 1 0 29.4 21.3H23.2" />
          <circle cx="21" cy="21.3" r="2.5" fill="#a3f451" />
        </svg>
        <div>
          <h1>گیلاکلیک</h1>
          <small>GILACLICK</small>
        </div>
      </div>
      <p class="tagline">از ایده تا توسعه<br /><em>راهکارهای دیجیتال</em></p>
      <div class="chips">
        <span>محصولات نرم‌افزاری</span>
        <span>طراحی و توسعه وب</span>
        <span>راهنمای گیلان</span>
      </div>
    </div>
    <div class="domain">gilaclick.ir</div>
  </body>
</html>
